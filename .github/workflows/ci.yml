name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm test
      - run: npm run check
      - run: node scripts/build-native.js
      - name: Verify Windows native policy
        if: runner.os == 'Windows'
        run: native/bin/win32-x64/policy-tests.exe
      - name: Verify Mac native policy and PCM conversion
        if: runner.os == 'macOS'
        run: bash native/macos/test.sh
      - run: npm audit --omit=dev
      - run: npm audit --omit=dev --prefix server

  portable-windows:
    if: github.event_name == 'push'
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: CHDSS-Windows-Portable
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

  relay-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-filtered.js
      - run: npm run smoke
        timeout-minutes: 6
      - run: bash -n server/chdss-server.sh
      - run: npm run dist:server
      - run: docker build -f server/Dockerfile -t chdss-relay:ci .
